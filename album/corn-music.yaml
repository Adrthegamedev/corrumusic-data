Commentary: |-
    <i>corru.works:</i> (Cohost)
    hello moon moth!! in short: no!
    most of the music that was heard in it is actually already in use in corru.observer - reworked in some way, sometimes shortened (i.e. the connection music), or secret/bonus (moth's theme)...
    
    the rest of the music is either suuuper unpolished, or something i want to use again, and haven't yet... but here are cool some songs that probably won't appear again! corru.network used a much more synthwavey sound (since i was really into that)... also, the static was a lot more aggressive, and many of the songs had strange vocal warbling elements present (which persist in some rare few places)!
    
    my style has changed sooo much since then that this stuff would never be made the way i did back then... but it is nostalgic, especially with the launchpad music - i have fond memories of those songs in particular, since this was a period where i would go to bed early and wake up at like 2AM so i could work on corru.network undisturbed at the cost of all else. something about those early mornings and working in the dark altered my brain and these songs remind me of that
    
    perhaps the launchpad melody will come back... it's a rewrite of the "Assemble" song on my soundcloud, and the origin of a 'leitmotif' still used in nearly all corru.observer music, so the fact it isn't even in the game is kinda funny
