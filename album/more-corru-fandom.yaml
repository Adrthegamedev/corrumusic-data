Commentary: |-
    <i>Octofoss:</i> (Soundcloud)
    Akizetesche qou Jokzi, a d̲e̲a̲d̲ foreigner from a far distant moon, finds herself in quite the handsome devilish scenario 35,814 feet under...
    A parody (fair use!) of That Handsome Devil's "Charlie's Inferno," recreated as a mod in free webgame corru.observer, which can be played at corru.observer.

    A joint effort between @sutrekirl (YouTube @) and I!!

    <i>Octofoss:</i> (Youtube)
    Akizetesche qou Jokzi, a d̲e̲a̲d̲ foreigner from a far distant moon, finds herself in quite the handsome devilish scenario 35,814 feet under...
    A parody (fair use!) of That Handsome Devil's "Charlie's Inferno," recreated as a mod in free webgame corru.observer, which can be played at https://corru.observer.

    Audio-only uploads:
    [Akizet's Inferno (full)](https://www.youtube.com/watch?v=OnbeLOWr6r8)
    [/akizets-inferno](https://soundcloud.com/octoish/akizets-inferno)

    CREDITS:
    @sutrekirl
    * Songwriting, initial prompt, and voice for Sourceless, Velzie, and Fairy #2

    @octofoss
    * Mixing/mastering, programming, and voice for Akizet, Effigy, and Fairy #1

    @othernamed_max
    * Akizet, Gakvu, and Gordon RVC models (used with permission)

    @corruworks
    * Game!


    You can actually entirely play this in-browser! Here's how:
    1. Go to https://corru.observer/local/uncosm/where/?force
    2. Open console, and run addResources(["[https://metaphorical.monster/INFERNO.js](https://metaphorical.monster/INFERNO.js)"])
    3. Enter, input "inferno" into the textbox, and bam!
