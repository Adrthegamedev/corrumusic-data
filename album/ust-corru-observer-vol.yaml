Commentary: |-
    <i>Poligonal:</i> ([Bandcamp about blurb](https://poligonal.bandcamp.com/album/ust-corru-observer-vol))
    A small fan UST for corru.observer, one of my favorite games.

    The game has such an interesting and distinct musical style. Quite hard to replicate, but still fun so I tried anyways.

    Btw check out the info for each track to get tiny scraps of lore/story for this hypothetical episode (^^)

    <i>Poligonal:</i> ([Bandcamp Download Read Me.txt file](https://poligonal.bandcamp.com/album/ust-corru-observer-vol))
    Hey Buddy
    For buying and downloading this, you get some bonus tracks. These are songs that I tried to make like corru, but either failed to be corruey or failed to be very good in general. Please don't hold high expectations for these songs.
