Track: EXTRA::"Desired Joy"
Duration: 2:12
Referenced Tracks:
- launchpad
Commentary: |-
    <i>NoisyRejects:</i> (The Embassy)
    early version of corru's better times track. i made this after corru had made a more flatly done remix of the launchpad track the two are a remix of, basically adding drums and more counter melody and such... corru didnt think it fit the vieb fo the memory exactly, which makes sense. i made this track from the perspective of moth and interloper and the player. it's a track mourning the better times we never got until it was all over, knowing that half of these people will die... we wanted to see them happy it's what we desired... in the end corru's was much more of the perspective of the moment the team, happy and joyful about a new spire being made